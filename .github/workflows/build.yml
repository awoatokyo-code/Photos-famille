name: Build APK
on: { workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npx --yes create-expo-app@latest app --template blank --no-install
      - run: |
          cp App.js app/App.js
          cp app.json app/app.json
          cd app
          npm install
          npx expo install expo-media-library expo-image-manipulator expo-blur expo-linear-gradient expo-keep-awake @react-native-async-storage/async-storage
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with: { name: photos-famille-apk, path: app/android/app/build/outputs/apk/release/app-release.apk }
